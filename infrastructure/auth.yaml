AWSTemplateFormatVersion: "2010-09-09"
Description: Cognito OAuth (client credentials) used by the AgentCore Gateway to call the runtime

Parameters:
  AppName:
    Type: String
  Environment:
    Type: String

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AppName}-${Environment}-mcp"

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: !Ref AppName
      Name: !Sub "${AppName}-${Environment}-mcp"
      Scopes:
        - ScopeName: invoke
          ScopeDescription: Call the Nano Banana MCP runtime

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "${AppName}-${Environment}-${AWS::AccountId}"

  GatewayClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AppName}-${Environment}-agentcore-gateway"
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes:
        - !Sub "${AppName}/invoke"

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  GatewayClientId:
    Value: !Ref GatewayClient
  DiscoveryUrl:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration"
  TokenUrl:
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/token"
  GatewayScope:
    Value: !Sub "${AppName}/invoke"
