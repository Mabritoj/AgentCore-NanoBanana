version = 0.1

[dev]
[dev.deploy.parameters]
stack_name = "nanobanana-dev"
s3_prefix = "nanobanana-dev"
resolve_s3 = true
capabilities = "CAPABILITY_NAMED_IAM"
parameter_overrides = "AppName=\"nanobanana\" Environment=\"dev\""
tags = "BACKUP=\"nanobanana-dev\""

[prd]
[prd.deploy.parameters]
stack_name = "nanobanana-prd"
s3_prefix = "nanobanana-prd"
resolve_s3 = true
capabilities = "CAPABILITY_NAMED_IAM"
parameter_overrides = "AppName=\"nanobanana\" Environment=\"prd\" GatewayExportPrefix=\"ironbear-agentcore-prd\""
tags = "BACKUP=\"nanobanana-prd\""
