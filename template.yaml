AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Nano Banana MCP server on Bedrock AgentCore Runtime (root stack; resources live in infrastructure/ nested stacks)

# No Globals block: this project has no AWS::Serverless::Function resources. The compute is an
# AgentCore Runtime container (see infrastructure/runtime.yaml), which SAM has no native resource for.

Parameters:
  AppName:
    Type: String
    Default: nanobanana
    AllowedPattern: "^[a-z][a-z0-9]{0,19}$"
    Description: Lowercase alphanumeric prefix used in resource names (the runtime name only allows letters, digits, underscores)
  Environment:
    Type: String
    AllowedValues: [dev, prd]
  ImageTag:
    Type: String
    Default: ""
    Description: Container image tag in ECR. Leave empty on the first deploy; the runtime is only created once a tag is supplied (see scripts/deploy.sh)

  GatewayExportPrefix:
    Type: String
    Default: ""
    Description: Export prefix of the AgentCore Gateway stack to register with, for example ironbear-agentcore-prd. Leave empty to skip registration (the dev environment, since only a prd gateway exists)

Conditions:
  HasImage: !Not [!Equals [!Ref ImageTag, ""]]
  HasGateway: !Not [!Equals [!Ref GatewayExportPrefix, ""]]
  RegisterTarget: !And [!Condition HasImage, !Condition HasGateway]

Resources:
  EcrStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: infrastructure/ecr.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment

  StorageStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: infrastructure/storage.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment

  RuntimeStack:
    Type: AWS::CloudFormation::Stack
    Condition: HasImage
    Properties:
      TemplateURL: infrastructure/runtime.yaml
      Parameters:
        AppName: !Ref AppName
        Environment: !Ref Environment
        ContainerUri: !Sub "${EcrStack.Outputs.RepositoryUri}:${ImageTag}"
        RepositoryArn: !GetAtt EcrStack.Outputs.RepositoryArn
        GeminiSecretArn: !GetAtt StorageStack.Outputs.GeminiSecretArn
        ImageBucketName: !GetAtt StorageStack.Outputs.ImageBucketName
        ImageBucketArn: !GetAtt StorageStack.Outputs.ImageBucketArn

  AgentCoreTargetStack:
    Type: AWS::CloudFormation::Stack
    Condition: RegisterTarget
    Properties:
      TemplateURL: infrastructure/agentcore-target.yaml
      Parameters:
        AppName: !Ref AppName
        GatewayExportPrefix: !Ref GatewayExportPrefix
        RuntimeArn: !GetAtt RuntimeStack.Outputs.RuntimeArn
        RuntimeId: !GetAtt RuntimeStack.Outputs.RuntimeId

Outputs:
  RepositoryUri:
    Value: !GetAtt EcrStack.Outputs.RepositoryUri
  GeminiSecretArn:
    Value: !GetAtt StorageStack.Outputs.GeminiSecretArn
  RuntimeArn:
    Condition: HasImage
    Value: !GetAtt RuntimeStack.Outputs.RuntimeArn
  GatewayTargetName:
    Condition: RegisterTarget
    Value: !GetAtt AgentCoreTargetStack.Outputs.GatewayTargetName
